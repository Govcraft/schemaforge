[package]
name = "schema-forge-codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
heck = "0.5.0"
minijinja = { version = "2.24.0", features = ["json"] }
schema-forge-config = { version = "0.1.0", path = "../schema-forge-config" }
schema-forge-core = { version = "0.20.0", path = "../schema-forge-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
schema-forge-dsl = { path = "../schema-forge-dsl" }
tempfile = "3.27.0"
