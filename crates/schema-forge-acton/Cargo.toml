[package]
name = "schema-forge-acton"
version = "0.49.1"
edition = "2021"

[dependencies]
schema-forge-core = { path = "../schema-forge-core" }
schema-forge-backend = { path = "../schema-forge-backend" }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
acton-service = { version = "0.47.0", default-features = false, features = ["http", "observability", "otel-metrics", "journald", "governor", "resilience", "audit", "openapi", "auth", "crypto-aws-lc-rs", "grpc", "tls", "windows-auth"] }
schema-forge-dsl = { path = "../schema-forge-dsl" }
schema-forge-surrealdb = { path = "../schema-forge-surrealdb", optional = true }
schema-forge-postgres = { path = "../schema-forge-postgres", optional = true }
async-graphql = { version = "7.2", features = ["dynamic-schema", "graphiql"], optional = true, default-features = false }
async-graphql-axum = { version = "7.2", optional = true }
arc-swap = "1"
tracing = { version = "0.1" }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
uuid = { version = "1.23.0", features = ["v4", "v7"] }
humantime = "2.3.0"
async-trait = "0.1.89"
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
prost = "0.14.3"
prost-reflect = "0.16.3"
bytes = "1.11.1"
http = "1.4.0"
tonic-prost = "0.14"
sync_wrapper = "1.0.2"
futures = "0.3.32"
aws-sdk-s3 = { version = "1.122.0", features = ["behavior-version-latest"] }
aws-config = "1.8.13"
aws-credential-types = "1.2.11"
thiserror = "2.0.18"
cedar-policy = "4"
toml = "1"
aws-lc-rs = { version = "1", features = ["fips"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "logging"] }
schema-forge-signing = { version = "0.1.0", path = "../schema-forge-signing" }
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls", "aws-lc-rs", "webpki-roots", "smtp-transport", "builder", "pool", "hostname"] }
schema-forge-cel = { version = "0.13.0", path = "../schema-forge-cel" }
rust_xlsxwriter = { version = "0.95.0", features = ["chrono"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
schema-forge-config = { version = "0.1.0", path = "../schema-forge-config" }
reqwest = { version = "0.13.5", default-features = false, features = ["http2", "rustls"] }


[features]
# Real database contract suites are opt-in; portable tests need no database engine.
test-surrealdb = ["dep:schema-forge-surrealdb", "schema-forge-surrealdb/test-support"]
sse = ["acton-service/sse"]
oauth = ["acton-service/oauth"]
surrealdb = ["acton-service/surrealdb", "dep:schema-forge-surrealdb"]
postgres = ["acton-service/database", "dep:schema-forge-postgres"]
graphql = ["dep:async-graphql", "dep:async-graphql-axum"]
# Build aws-lc-rs against the FIPS-validated AWS-LC C library
# (aws-lc-fips-sys) so federal deployments use NIST-certified crypto.
# Requires cmake and a compatible toolchain at build time.
fips = ["dep:aws-lc-rs"]

[dev-dependencies]
tower = { version = "0.5" }
http-body-util = "0.1"
tempfile = "3.25.0"
tokio-stream = { version = "0.1.18", features = ["net"] }
toml = "1.1.2"
calamine = "0.35.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tonic-prost-build = "0.14"

[[test]]
name = "auth_demo"
required-features = ["test-surrealdb"]

[[test]]
name = "auth_login"
required-features = ["test-surrealdb"]

[[test]]
name = "conditional_entities"
required-features = ["test-surrealdb"]

[[test]]
name = "create_intents"
