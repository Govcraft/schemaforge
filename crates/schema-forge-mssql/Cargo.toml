[package]
name = "schema-forge-mssql"
version = "0.8.1"
edition = "2021"

[dependencies]
acton-service = { version = "0.46.0", features = ["mssql", "crypto-aws-lc-rs"], default-features = false }
bb8 = "0.9.1"
bb8-tiberius = "0.16.0"
schema-forge-backend = { version = "0.21.1", path = "../schema-forge-backend" }
schema-forge-core = { version = "0.19.0", path = "../schema-forge-core" }
serde_json = "1.0.151"
tiberius = "0.12.3"

[dev-dependencies]
testcontainers = "0.28.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
toml = "1.1.4"

