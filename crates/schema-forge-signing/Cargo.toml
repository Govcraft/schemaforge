[package]
name = "schema-forge-signing"
version = "0.1.0"
edition = "2021"
description = "Digital-signature verification for SchemaForge .schema files. Detached per-file signatures plus a signed directory manifest, with pluggable trust roots (ed25519, SSH allowed_signers, cosign-keyless)."

[dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["pkcs8", "pem"] }
globset = "0.4.18"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sigstore-trust-root = { version = "0.7.0", default-features = false, features = ["tuf"] }
sigstore-verify = { version = "0.7.0", default-features = false, features = ["rustls"] }
ssh-key = { version = "0.6.7", features = ["ed25519"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["parsing", "macros"] }
toml = "1.1.2"

