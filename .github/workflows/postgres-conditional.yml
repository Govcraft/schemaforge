name: PostgreSQL contracts and feature isolation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  conditional:
    name: PostgreSQL storage, HTTP, and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schemaforge
          POSTGRES_PASSWORD: schemaforge-test
          POSTGRES_DB: schemaforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schemaforge -d schemaforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: schemaforge
      PGPASSWORD: schemaforge-test
      PGDATABASE: schemaforge_test
      SCHEMAFORGE_TEST_POSTGRES_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test
      SCHEMAFORGE_TEST_POSTGRES_HTTP_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Dconditional_http
      SCHEMAFORGE_TEST_POSTGRES_IDENTITY_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Doauth_http
      SCHEMAFORGE_TEST_POSTGRES_EVENTS_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Devents_http
      SCHEMAFORGE_TEST_POSTGRES_CREATE_INTENTS_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Dcreate_intents_http
      SCHEMAFORGE_TEST_POSTGRES_DISPOSABLE: "1"
      CARGO_FEATURES: schema-forge-cli/postgres,schema-forge-cli/oauth,schema-forge-cli/sse
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: postgres-extensions
          packages: protobuf-compiler libprotobuf-dev libkrb5-dev postgresql-client
      - name: Verify PostgreSQL dependency isolation
        run: |
          cargo tree --locked -p schema-forge-cli -p schema-forge-acton --no-default-features --features "$CARGO_FEATURES" --prefix none --format '{p}|{f}' > "$RUNNER_TEMP/postgres-graph.txt"
          python3 scripts/ci/check_postgres_graph.py "$RUNNER_TEMP/postgres-graph.txt" --extensions enabled
      - name: Prepare isolated HTTP fixtures
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA conditional_http; CREATE SCHEMA oauth_http; CREATE SCHEMA events_http; CREATE SCHEMA create_intents_http'
      - name: Test PostgreSQL storage and consumers
        run: cargo nextest run --locked -p schema-forge-postgres -p schema-forge-acton -p schema-forge-cli --no-default-features --features "$CARGO_FEATURES" --no-fail-fast
      - name: Test live storage, HTTP, identity, events, and create intents
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p schema-forge-postgres -p schema-forge-acton -p schema-forge-cli --no-default-features --features "$CARGO_FEATURES" --run-ignored only -E 'package(schema-forge-postgres) | (package(schema-forge-acton) & binary(/^postgres_/))' --no-fail-fast
      - name: Deny PostgreSQL consumer lints
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p schema-forge-postgres -p schema-forge-acton -p schema-forge-cli --no-default-features --features "$CARGO_FEATURES" --all-targets -- -D warnings

  extensions-disabled:
    name: PostgreSQL extensions remain opt-in
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_FEATURES: schema-forge-cli/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: postgres-no-extensions
      - name: Verify backend and extension isolation
        run: |
          cargo tree --locked -p schema-forge-cli -p schema-forge-acton --no-default-features --features "$CARGO_FEATURES" --prefix none --format '{p}|{f}' > "$RUNNER_TEMP/postgres-graph.txt"
          python3 scripts/ci/check_postgres_graph.py "$RUNNER_TEMP/postgres-graph.txt" --extensions disabled
      - name: Test extension-disabled behavior
        run: cargo nextest run --locked -p schema-forge-cli -p schema-forge-acton --no-default-features --features "$CARGO_FEATURES" --lib --test oauth_openapi -E 'test(export_reuses_login_response) | test(export_lists_event_stream) | test(events_route_is_absent)' --no-fail-fast
      - name: Deny extension-disabled lints
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p schema-forge-cli -p schema-forge-acton --no-default-features --features "$CARGO_FEATURES" --all-targets -- -D warnings
