name: PostgreSQL conditional mutations

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conditional:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schemaforge
          POSTGRES_PASSWORD: schemaforge-test
          POSTGRES_DB: schemaforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schemaforge -d schemaforge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: schemaforge
      PGPASSWORD: schemaforge-test
      PGDATABASE: schemaforge_test
      SCHEMAFORGE_TEST_POSTGRES_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler libkrb5-dev postgresql-client
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install nextest
        run: cargo install cargo-nextest --locked
      - name: Run storage concurrency cases
        run: cargo nextest run -p schema-forge-backend -p schema-forge-postgres --run-ignored all --no-fail-fast
      - name: Prepare disposable HTTP namespace
        if: ${{ !cancelled() }}
        run: psql -X -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA conditional_http; CREATE SCHEMA oauth_http; CREATE SCHEMA events_http'
      - name: Run complete runtime and schema suites
        if: ${{ !cancelled() }}
        run: cargo nextest run -p schema-forge-acton -p schema-forge-surrealdb -p schema-forge-core -p schema-forge-dsl --features schema-forge-acton/postgres,schema-forge-acton/graphql,schema-forge-acton/oauth,schema-forge-acton/sse --no-fail-fast
      - name: Run HTTP authorization and concurrency cases
        if: ${{ !cancelled() }}
        env:
          SCHEMAFORGE_TEST_POSTGRES_DISPOSABLE: "1"
          SCHEMAFORGE_TEST_POSTGRES_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Dconditional_http
        run: cargo nextest run -p schema-forge-acton --features postgres,graphql,oauth,sse --test conditional_entities --run-ignored only --no-fail-fast
      - name: Check PostgreSQL identity uniqueness
        if: ${{ !cancelled() }}
        env:
          SCHEMAFORGE_TEST_POSTGRES_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Doauth_http
        run: cargo nextest run -p schema-forge-acton --features postgres,oauth,sse --test oauth_storage --run-ignored only --no-fail-fast
      - name: Check PostgreSQL committed event projection
        if: ${{ !cancelled() }}
        env:
          SCHEMAFORGE_TEST_POSTGRES_URL: postgres://schemaforge:schemaforge-test@localhost:5432/schemaforge_test?options=-csearch_path%3Devents_http
        run: cargo nextest run -p schema-forge-acton --features postgres,oauth,sse --test entity_events --run-ignored only --no-fail-fast
      - name: Check CLI preparation and security behavior
        if: ${{ !cancelled() }}
        run: cargo nextest run -p schema-forge-cli --no-default-features --features postgres,oauth,sse --no-fail-fast
      - name: Check extension features remain opt-in
        if: ${{ !cancelled() }}
        run: cargo nextest run -p schema-forge-cli -p schema-forge-acton --no-default-features --features schema-forge-cli/postgres -E 'test(export_reuses_login_response) | test(export_lists_event_stream) | test(events_route_is_absent)' --no-fail-fast
      - name: Check SurrealDB CLI integration
        if: ${{ !cancelled() }}
        run: cargo nextest run -p schema-forge-cli -p schema-forge-acton --features schema-forge-cli/oauth,schema-forge-cli/sse --no-fail-fast
      - name: Deny runtime and backend lints
        if: ${{ !cancelled() }}
        run: cargo clippy -p schema-forge-acton -p schema-forge-surrealdb -p schema-forge-core -p schema-forge-dsl -p schema-forge-backend -p schema-forge-postgres --features schema-forge-acton/postgres,schema-forge-acton/graphql,schema-forge-acton/oauth,schema-forge-acton/sse --all-targets -- -D warnings
      - name: Deny CLI lints
        if: ${{ !cancelled() }}
        run: cargo clippy -p schema-forge-cli --no-default-features --features postgres,oauth,sse --all-targets -- -D warnings
      - name: Deny SurrealDB CLI lints
        if: ${{ !cancelled() }}
        run: cargo clippy -p schema-forge-cli -p schema-forge-acton --features schema-forge-cli/oauth,schema-forge-cli/sse --all-targets -- -D warnings
      - name: Clean disposable HTTP namespace
        if: always()
        run: psql -X -v ON_ERROR_STOP=1 -c 'DROP SCHEMA IF EXISTS conditional_http CASCADE; DROP SCHEMA IF EXISTS oauth_http CASCADE; DROP SCHEMA IF EXISTS events_http CASCADE'
