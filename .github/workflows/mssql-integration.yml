name: MSSQL Integration

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_INCREMENTAL: '0'

jobs:
  windows-build:
    name: Windows MSSQL compilation and signature checks
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Protocol Buffers compiler
        shell: pwsh
        run: choco install protoc --no-progress --yes

      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          cache-key: windows-mssql

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify console signature with Windows Git Bash
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          gh release download v0.1.0 \
            --repo Govcraft/schemaforge-console \
            --pattern 'SHA256SUMS' \
            --pattern 'SHA256SUMS.sig' \
            --pattern 'SHA256SUMS.pem'
          cosign verify-blob \
            --certificate SHA256SUMS.pem \
            --signature SHA256SUMS.sig \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/Govcraft/schemaforge-console/\.github/workflows/release\.yml@' \
            SHA256SUMS

      - name: Check native Windows MSSQL binary
        run: >-
          cargo check --locked --package schema-forge-cli --bin schemaforge
          --no-default-features --features mssql

  sql-server:
    name: SQL Server ${{ matrix.version }} backend validation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 2019
            test: connects_and_initializes_metadata_on_sql_server_2019
          - version: 2022
            test: connects_and_initializes_metadata_on_sql_server_2022

    steps:
      - uses: actions/checkout@v6

      - name: Install system build dependencies
        run: python3 scripts/ci/install_prerequisites.py protobuf-compiler libkrb5-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Rust cache
        uses: ./.github/actions/rust-cache
        with:
          cache-key: sql-server

      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Run SQL Server integration test
        env:
          TEST_NAME: ${{ matrix.test }}
        run: >-
          cargo nextest run --package schema-forge-mssql --test sql_server
          --run-ignored only -E "test(=$TEST_NAME)"
      - name: Deny SQL Server lints
        if: matrix.version == 2019
        run: cargo clippy -p schema-forge-mssql --all-targets -- -D warnings
      - name: Run SQL Server unit and migration tests
        if: matrix.version == 2019
        run: cargo nextest run -p schema-forge-mssql --no-fail-fast
