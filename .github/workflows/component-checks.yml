name: Component checks
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  check:
    name: ${{ inputs.component == 'tooling' && 'Portable tooling tests, lints, and doctests' || inputs.component == 'runtime' && 'Portable runtime tests and lints' || inputs.component == 'cli' && 'Server CLI tests and lints' || 'Unknown component' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ inputs.component }}-portable
      - name: Compile and run component tests
        run: bash scripts/ci/check_component.sh tests
      - name: Lint all component targets
        run: bash scripts/ci/check_component.sh lint
      - name: Run tooling doctests
        if: inputs.component == 'tooling'
        run: bash scripts/ci/check_component.sh doctests
