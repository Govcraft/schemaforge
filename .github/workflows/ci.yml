name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Select affected components
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.select.outputs.base }}
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
      reuse_run: ${{ steps.reuse.outputs.reuse_run }}
      tooling: ${{ steps.select.outputs.tooling }}
      runtime: ${{ steps.select.outputs.runtime }}
      cli: ${{ steps.select.outputs.cli }}
      postgres: ${{ steps.select.outputs.postgres }}
      surrealdb: ${{ steps.select.outputs.surrealdb }}
      mssql: ${{ steps.select.outputs.mssql }}
      cel: ${{ steps.select.outputs.cel }}
      site: ${{ steps.select.outputs.site }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select checks
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          python3 scripts/ci/select_checks.py --head HEAD --event "$EVENT_NAME" --base "$BASE_REVISION"
      - name: Verify reusable PR validation
        id: reuse
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTION_JSON: ${{ toJSON(steps.select.outputs) }}
        run: python3 scripts/ci/validation_evidence.py find
  validation:
    name: Selected component validation
    needs: changes
    if: needs.changes.outputs.reused != 'true'
    uses: ./.github/workflows/full-validation.yml
    with:
      tooling: ${{ needs.changes.outputs.tooling == 'true' }}
      runtime: ${{ needs.changes.outputs.runtime == 'true' }}
      cli: ${{ needs.changes.outputs.cli == 'true' }}
      postgres: ${{ needs.changes.outputs.postgres == 'true' }}
      surrealdb: ${{ needs.changes.outputs.surrealdb == 'true' }}
      mssql: ${{ needs.changes.outputs.mssql == 'true' }}
      cel: ${{ needs.changes.outputs.cel == 'true' }}
      site: ${{ needs.changes.outputs.site == 'true' }}
      base: ${{ needs.changes.outputs.base }}
      site-candidate-server: ${{ needs.changes.outputs.runtime == 'true' || needs.changes.outputs.cli == 'true' || needs.changes.outputs.surrealdb == 'true' || needs.changes.outputs.postgres == 'true' || needs.changes.outputs.mssql == 'true' }}
  required:
    name: Required CI
    needs: [changes, validation]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Require selection and validation to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check_results.py required
      - name: Record successful PR validation
        if: github.event_name == 'pull_request'
        env:
          SELECTION_JSON: ${{ toJSON(needs.changes.outputs) }}
        run: python3 scripts/ci/validation_evidence.py record
      - name: Save reusable validation evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-validation-v1-${{ github.run_attempt }}
          path: validation-evidence.json
          if-no-files-found: error
          retention-days: 30
